<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boletim Escolar - Gotham Dark</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- Three.js para o ambiente de Chuva e Lua -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Fundo 3D (Céu escuro, Lua e Chuva) -->
    <div id="canvas-container"></div>

    <!-- Imagem Real HD do Batman (Substitui o modelo 3D quadrado) -->
    <img src="https://i.ibb.co/3TL5x1N/batman-pattinson.png" alt="Batman Real" class="batman-real">

    <!-- Boletim Escolar (Alinhado à Esquerda) -->
    <main class="boletim-container">
        <header>
            <h1>BOLETIM ESCOLAR</h1>
            <p class="subtitulo">ALUNO: <input type="text" id="nome-aluno" value="SEU NOME AQUI"></p>
        </header>

        <section class="cards-resumo">
            <div class="card">
                <h3>Média Geral</h3>
                <p id="media-geral">8.7</p>
            </div>
            <div class="card">
                <h3>Frequência</h3>
                <p>95%</p>
                <span class="status-frequencia">● NORMAL</span>
            </div>
            <div class="card">
                <h3>Situação</h3>
                <p class="situacao-bom" style="font-size: 1.2rem; margin-top: 5px;">APROVADO</p>
            </div>
        </section>

        <section class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th>Matéria</th>
                        <th>1º Bimestre</th>
                        <th>2º Bimestre</th>
                        <th>Média</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Língua Portuguesa</td>
                        <td><input type="number" class="nota" value="8.5" min="0" max="10" step="0.1"></td>
                        <td><input type="number" class="nota" value="9.0" min="0" max="10" step="0.1"></td>
                        <td class="media-disc">8.8</td>
                        <td class="situacao-bom">Aprovado</td>
                    </tr>
                    <tr>
                        <td>Matemática</td>
                        <td><input type="number" class="nota" value="8.0" min="0" max="10" step="0.1"></td>
                        <td><input type="number" class="nota" value="8.5" min="0" max="10" step="0.1"></td>
                        <td class="media-disc">8.3</td>
                        <td class="situacao-bom">Aprovado</td>
                    </tr>
                    <tr>
                        <td>História</td>
                        <td><input type="number" class="nota" value="9.0" min="0" max="10" step="0.1"></td>
                        <td><input type="number" class="nota" value="9.5" min="0" max="10" step="0.1"></td>
                        <td class="media-disc">9.3</td>
                        <td class="situacao-bom">Aprovado</td>
                    </tr>
                    <tr>
                        <td>Geografia</td>
                        <td><input type="number" class="nota" value="8.5" min="0" max="10" step="0.1"></td>
                        <td><input type="number" class="nota" value="8.0" min="0" max="10" step="0.1"></td>
                        <td class="media-disc">8.3</td>
                        <td class="situacao-bom">Aprovado</td>
                    </tr>
                    <tr>
                        <td>Ciências</td>
                        <td><input type="number" class="nota" value="9.0" min="0" max="10" step="0.1"></td>
                        <td><input type="number" class="nota" value="9.0" min="0" max="10" step="0.1"></td>
                        <td class="media-disc">9.0</td>
                        <td class="situacao-bom">Aprovado</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
