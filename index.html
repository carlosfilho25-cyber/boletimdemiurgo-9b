<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boletim Escolar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="bg"></canvas>

<div id="stage">
  <div id="card">
    <h1>Boletim Escolar</h1>

    <div class="tabela-wrap">
      <table>
        <thead>
          <tr>
            <th>Disciplina</th>
            <th>1º</th><th>2º</th><th>3º</th><th>4º</th>
            <th>Média</th>
            <th>Situação</th>
          </tr>
        </thead>
        <tbody id="corpo"></tbody>
      </table>
    </div>

    <div class="resumo">
      <label>Frequência:
        <input id="freq" type="number" min="0" max="100" step="1">%
      </label>
      <span>Média geral: <span id="mg">—</span></span>
      <span id="sg">—</span>
      <span id="sf">—</span>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
